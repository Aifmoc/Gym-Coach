name: Apply foods v30

on:
  push:
    branches:
      - chatgpt/add-pisto-soja
    paths:
      - .github/workflows/apply-foods-v30.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/add-pisto-soja
          fetch-depth: 0

      - name: Add pisto and soy blueberry yogurt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '// =============== v21 TRAINING / MOBILE / TIMER OVERRIDES ==============='
          stamp = '// Migración v30: pisto + yogur de soja con arándanos (etiquetas 05/10/2026).'
          block = r'''// Migración v30: pisto + yogur de soja con arándanos (etiquetas 05/10/2026).
          // Valores copiados de las etiquetas aportadas por Diego. No pisa alimentos editados manualmente.
          if(!db.profile.foodDbVersion || db.profile.foodDbVersion<30){
            db.foods=db.foods||[];
            const n30=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
            const upsert30=(nf,aliases=[])=>{
              const keys=[nf.name,...aliases].map(n30);
              const ex=db.foods.find(f=>keys.includes(n30(f.name)));
              if(ex&&ex.userEdited)return;
              if(ex)Object.assign(ex,nf); else db.foods.push({...nf});
            };
            upsert30({
              name:'Pisto / fritada de verduras',cat:'Verdura',unit:'g',base:100,defaultQty:190,
              kcal:92,p:1.3,c:10.4,f:4.7,sugar:8.5,
              modo:'tal cual',note:'etiqueta: 92 kcal · P 1,3 · C 10,4 · G 4,7 por 100 g; envase 380 g',editable:true
            },['Pisto','Fritada pisto','Fritada de verduras']);
            upsert30({
              name:'Yogur de soja con arándanos',cat:'Lácteos',unit:'unidad',base:1,defaultQty:1,
              kcal:76,p:3.7,c:10.5,f:2.1,fiber:0.3,sugar:10.2,
              modo:'tal cual',note:'Mercadona · 1 unidad = 100 g · etiqueta: 76 kcal · P 3,7 · C 10,5 · G 2,1',editable:true
            },['Soja arándanos','Soja arándanos mirtillos','Yogur soja arándanos']);
            db.profile.foodDbVersion=30;
            localStorage.setItem(APPKEY,JSON.stringify(db));
          }
          '''

          if stamp not in text:
              if marker not in text:
                  raise SystemExit('Insertion marker not found in index.html')
              text = text.replace(marker, block + '\n\n' + marker, 1)
              index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("const VERSION='v31-20261003';", "const VERSION='v32-20261005';")
          sw_text = sw_text.replace('/* Gym Coach v31.', '/* Gym Coach v32.')
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Commit patched app
        shell: bash
        run: |
          rm -f .github/workflows/apply-foods-v30.yml
          git config user.name "chatgpt-gym-coach"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-foods-v30.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add pisto and soy blueberry yogurt"
          git push origin HEAD:chatgpt/add-pisto-soja
